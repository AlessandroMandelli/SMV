<!doctype html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#15568d" />
    <meta
      name="description"
      content="Schede di ispezione e manutenzione del Sacro Monte di Varese. Compilazione e salvataggio anche offline."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>Schede di Restauro — Sacro Monte di Varese</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="./assets/icon-180.png" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./pwa-install.js?v=3.4.1" defer></script>
    <script src="./app.bundle.js?v=3.4.1" defer></script>
  </head>
  <body>
    <section id="home" class="home">
      <button id="installHeader" class="install" type="button">
        Installa app
      </button>
      <main class="welcome">
        <div class="home-branding">
          <h1><span id="homeTitle">Schede di Restauro</span></h1>
          <p class="subtitle">
            <span id="homeSubtitle">Sacro Monte di Varese</span>
          </p>
        </div>
        <div class="home-actions">
          <button id="newButton" class="home-button primary">
            Compila una nuova scheda
          </button>
          <button id="resumeButton" class="home-button secondary" disabled>
            Riprendi la bozza
          </button>
          <button id="importButton" class="home-button">Importa JSON</button>
        </div>
        <p id="homeStatus" class="quiet" role="status" hidden="hidden">
          Caricamento…
        </p>
      </main>
      <div class="landscape" aria-hidden="true"></div>
    </section>

    <section id="editor" hidden>
      <header class="toolbar">
        <label for="filename">Nome del file</label>
        <input
          id="filename"
          type="text"
          autocomplete="off"
          aria-label="Nome del file senza estensione"
        />
        <details id="options" class="options">
          <summary aria-label="Opzioni">⋮ <span>Opzioni</span></summary>
          <div class="menu">
            <button id="resetButton" class="danger">Reset scheda</button>
            <button id="infoButton" type="button">Info</button>
            <hr id="installSeparator" class="menu-separator" />
            <button id="installMenu" type="button">Installa app</button>
          </div>
        </details>
      </header>
      <main id="sectionContent" class="sheet" tabindex="-1"></main>
      <section
        id="exportReady"
        class="export-ready"
        aria-label="File da scaricare"
        hidden
      >
        <div class="export-files">
          <a id="saveDocx" data-format="docx" target="_blank" rel="noopener" class="file-button" hidden>Salva DOCX</a>
          <a id="savePdf" data-format="pdf" target="_blank" rel="noopener" class="file-button" hidden>Salva PDF</a>
          <a id="saveJson" data-format="json" target="_blank" rel="noopener" class="file-button" hidden>Salva JSON</a>
          <a id="savePackage" target="_blank" rel="noopener" class="file-button primary" hidden>Salva ZIP</a>
          <button id="sharePdf" type="button" hidden>Condividi PDF</button>
        </div>
      </section>
      <footer class="navigation">
        <button id="previous" type="button"></button>
        <div class="nav-status">
          <span id="sectionCounter"></span
          ><small id="saveStatus" role="status"></small>
        </div>
        <button id="next" type="button" class="primary"></button>
      </footer>
    </section>

    <dialog id="infoDialog" class="info-dialog" aria-labelledby="infoTitle">
      <div class="dialog-heading"><h2 id="infoTitle">Info</h2><button type="button" class="dialog-close" data-close="infoDialog" aria-label="Chiudi">×</button></div>
      <a id="pwaLink" class="info-link" href="https://alessandromandelli.github.io/SMV/" target="_blank" rel="noopener">https://alessandromandelli.github.io/SMV/</a>
      <p id="appVersion" class="app-version"></p>
    </dialog>
    <dialog id="saveDialog" class="save-dialog" aria-labelledby="saveTitle">
      <form id="saveForm">
        <div class="dialog-heading"><h2 id="saveTitle">Salva scheda</h2><button type="button" id="closeSave" class="dialog-close" data-close="saveDialog" aria-label="Chiudi">×</button></div>
        <div class="save-formats">
          <label><input type="checkbox" name="format" value="docx" checked />DOCX</label>
          <label><input type="checkbox" name="format" value="pdf" checked />PDF</label>
          <label><input type="checkbox" name="format" value="json" checked />JSON</label>
        </div>
        <p id="saveError" class="save-error" role="alert" hidden></p>
        <button id="confirmSave" class="primary" type="submit">Salva</button>
      </form>
    </dialog>
    <dialog id="newDialog">
      <form id="newForm">
        <h2>Nuova scheda</h2>
        <label
          ><select
            id="assetSelect"
            required
            aria-label="Seleziona il bene"
          ></select
        ></label>
        <div class="dialog-actions">
          <button type="button" data-close="newDialog">Annulla</button
          ><button class="primary" type="submit">Apri scheda</button>
        </div>
      </form>
    </dialog>
    <dialog id="messageDialog">
      <h2 id="dialogTitle"></h2>
      <p id="dialogMessage"></p>
      <div class="dialog-actions">
        <button data-close="messageDialog" class="primary">Chiudi</button>
      </div>
    </dialog>
    <input id="jsonInput" type="file" accept=".json,application/json" hidden />
    <input id="photoInput" type="file" accept="image/*" multiple hidden />
    <input
      id="cameraInput"
      type="file"
      accept="image/*"
      capture="environment"
      hidden
    />
    <div id="toast" role="status" hidden></div>
    <noscript>Attiva JavaScript per compilare le schede.</noscript>
  </body>
</html>
